name: AVR sysroot Build Pipeline

on:
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Build avr-libc from git HEAD and publish as nightly packages'
        type: boolean
        default: false
  # Scheduled runs are always nightly builds
  schedule:
    - cron: '0 0 * * *'

env:
  NIGHTLY: ${{ (github.event_name == 'schedule' || inputs.nightly) && '1' || '0' }}

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Build avr sysroot
        uses: ./.github/actions/sysroot-builder
        with:
          target: avr
          push: false
          sha: ${{ github.sha }}
          build-args: |
            NIGHTLY=${{ env.NIGHTLY }}
          secrets: |
            "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}"
          token: ${{ secrets.GITHUB_TOKEN }}

  dispatch:
    needs: main
    runs-on: ubuntu-latest
    env:
      DISPATCH_TOKEN: ${{ secrets.CBA_DISPATCH_TOKEN }}
    steps:
      # Skipped automatically when the org secret is not configured.
      - name: Notify BoardManagerFiles
        if: env.DISPATCH_TOKEN != ''
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ClangBuiltArduino/BoardManagerFiles/dispatches \
            -d '{"event_type":"tc-build-release","client_payload":{"channel":"${{ env.NIGHTLY == '1' && 'nightly' || 'stable' }}"}}'
