name: LLVM Build Pipeline

on:
  workflow_dispatch:
    inputs:
      nightly:
        description: "Build from upstream git HEAD and publish as nightly packages"
        type: boolean
        default: false
      hosts:
        description: "Which host architectures to build"
        type: choice
        options: [all, amd64, aarch64]
        default: all
  # Scheduled runs are always nightly builds
  schedule:
    - cron: "0 0 * * *"

# Serialize runs: pipelines publish releases and GHCR images.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.nightly }}
  cancel-in-progress: false

env:
  PROJECT: llvm
  NIGHTLY: ${{ (github.event_name == 'schedule' || inputs.nightly) && '1' || '0' }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          HOSTS: ${{ inputs.hosts }}
        run: |
          case "${HOSTS:-all}" in
            amd64)
              echo 'matrix={"include":[{"arch":"amd64","runs":"ubuntu-latest"}]}' >> "$GITHUB_OUTPUT" ;;
            aarch64)
              echo 'matrix={"include":[{"arch":"aarch64","runs":"ubuntu-24.04-arm"}]}' >> "$GITHUB_OUTPUT" ;;
            *)
              echo 'matrix={"include":[{"arch":"amd64","runs":"ubuntu-latest"},{"arch":"aarch64","runs":"ubuntu-24.04-arm"}]}' >> "$GITHUB_OUTPUT" ;;
          esac

  deps:
    needs: resolve
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.runs }}
    env:
      PLATFORM: ${{ matrix.arch }}-linux
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Build deps stage
        uses: ./.github/actions/stage-builder
        with:
          target: deps-local
          project: ${{ env.PROJECT }}
          host: ${{ env.PLATFORM }}
          file: dockerfiles/llvm/llvm-linux.Dockerfile
          push: true
          tags: deps:${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

  deps-glibc:
    needs: resolve
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.runs }}
    env:
      PLATFORM: ${{ matrix.arch }}-linux
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Build deps stage for glibc
        uses: ./.github/actions/stage-builder
        with:
          target: deps-glibc-local
          project: ${{ env.PROJECT }}
          host: ${{ env.PLATFORM }}
          file: dockerfiles/llvm/LLVMgold-linux.Dockerfile
          push: true
          tags: deps-glibc:${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

  stage1:
    needs: [resolve, deps]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.runs }}
    env:
      PLATFORM: ${{ matrix.arch }}-linux
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Build stage1
        uses: ./.github/actions/stage-builder
        with:
          target: stage1-local
          project: ${{ env.PROJECT }}
          host: ${{ env.PLATFORM }}
          file: dockerfiles/llvm/llvm-linux.Dockerfile
          push: true
          tags: stage1:${{ github.sha }}
          build-args: |
            DEPS_IMAGE=ghcr.io/clangbuiltarduino/${{ env.PROJECT }}-${{ env.PLATFORM }}-deps:${{ github.sha }}
            NIGHTLY=${{ env.NIGHTLY }}
          token: ${{ secrets.GITHUB_TOKEN }}

  stage1-glibc:
    needs: [resolve, deps-glibc]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.runs }}
    env:
      PLATFORM: ${{ matrix.arch }}-linux
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Build stage1 for glibc
        uses: ./.github/actions/stage-builder
        with:
          target: stage1-glibc-local
          project: ${{ env.PROJECT }}
          host: ${{ env.PLATFORM }}
          file: dockerfiles/llvm/LLVMgold-linux.Dockerfile
          push: true
          tags: stage1-glibc:${{ github.sha }}
          build-args: |
            DEPS_IMAGE_GLIBC=ghcr.io/clangbuiltarduino/${{ env.PROJECT }}-${{ env.PLATFORM }}-deps-glibc:${{ github.sha }}
            NIGHTLY=${{ env.NIGHTLY }}
          token: ${{ secrets.GITHUB_TOKEN }}

  stage2:
    needs: [resolve, stage1]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.runs }}
    env:
      PLATFORM: ${{ matrix.arch }}-linux
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Build stage2
        uses: ./.github/actions/stage-builder
        with:
          target: stage2-local
          project: ${{ env.PROJECT }}
          host: ${{ env.PLATFORM }}
          file: dockerfiles/llvm/llvm-linux.Dockerfile
          push: true
          tags: stage2:${{ github.sha }}
          build-args: |
            STAGE1_IMAGE=ghcr.io/clangbuiltarduino/${{ env.PROJECT }}-${{ env.PLATFORM }}-stage1:${{ github.sha }}
            NIGHTLY=${{ env.NIGHTLY }}
          token: ${{ secrets.GITHUB_TOKEN }}

  extra-pushllvm:
    needs: [resolve, stage2]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.runs }}
    env:
      PLATFORM: ${{ matrix.arch }}-linux
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Build extras and post build
        uses: ./.github/actions/stage-builder
        with:
          target: extrabuild
          project: ${{ env.PROJECT }}
          host: ${{ env.PLATFORM }}
          file: dockerfiles/llvm/llvm-linux.Dockerfile
          push: false
          tags: extrabuild:${{ github.sha }}
          build-args: |
            STAGE2_IMAGE=ghcr.io/clangbuiltarduino/${{ env.PROJECT }}-${{ env.PLATFORM }}-stage2:${{ github.sha }}
            NIGHTLY=${{ env.NIGHTLY }}
            PKG_ARCH=${{ matrix.arch }}
          secrets: |
            "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}"
          token: ${{ secrets.GITHUB_TOKEN }}

  llvmgold-musl:
    needs: [resolve, stage1]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.runs }}
    env:
      PLATFORM: ${{ matrix.arch }}-linux
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Build LLVMgold musl
        uses: ./.github/actions/stage-builder
        with:
          target: llvmgold-musl-local
          project: llvmgold
          host: ${{ env.PLATFORM }}
          file: dockerfiles/llvm/LLVMgold-linux.Dockerfile
          push: true
          tags: final-musl:${{ github.sha }}
          build-args: |
            STAGE1_IMAGE_MUSL=ghcr.io/clangbuiltarduino/${{ env.PROJECT }}-${{ env.PLATFORM }}-stage1:${{ github.sha }}
            NIGHTLY=${{ env.NIGHTLY }}
          token: ${{ secrets.GITHUB_TOKEN }}

  llvmgold-glibc:
    needs: [resolve, stage1-glibc]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.runs }}
    env:
      PLATFORM: ${{ matrix.arch }}-linux
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Build LLVMgold glibc
        uses: ./.github/actions/stage-builder
        with:
          target: llvmgold-glibc-local
          project: llvmgold
          host: ${{ env.PLATFORM }}
          file: dockerfiles/llvm/LLVMgold-linux.Dockerfile
          push: true
          tags: final-glibc:${{ github.sha }}
          build-args: |
            STAGE1_IMAGE_GLIBC=ghcr.io/clangbuiltarduino/${{ env.PROJECT }}-${{ env.PLATFORM }}-stage1-glibc:${{ github.sha }}
            NIGHTLY=${{ env.NIGHTLY }}
          token: ${{ secrets.GITHUB_TOKEN }}

  packaging-llvmgold:
    needs: [resolve, llvmgold-glibc, llvmgold-musl]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.runs }}
    env:
      PLATFORM: ${{ matrix.arch }}-linux
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Pack and push archives
        uses: ./.github/actions/stage-builder
        with:
          target: packing
          project: ${{ env.PROJECT }}
          host: ${{ env.PLATFORM }}
          file: dockerfiles/llvm/LLVMgold-linux.Dockerfile
          push: false
          tags: packing:${{ github.sha }}
          build-args: |
            FINAL_IMAGE_GLIBC=ghcr.io/clangbuiltarduino/llvmgold-${{ env.PLATFORM }}-final-glibc:${{ github.sha }}
            FINAL_IMAGE_MUSL=ghcr.io/clangbuiltarduino/llvmgold-${{ env.PLATFORM }}-final-musl:${{ github.sha }}
            NIGHTLY=${{ env.NIGHTLY }}
            PKG_ARCH=${{ matrix.arch }}
          secrets: |
            "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}"
          token: ${{ secrets.GITHUB_TOKEN }}

  dispatch:
    needs: [extra-pushllvm, packaging-llvmgold]
    runs-on: ubuntu-latest
    env:
      DISPATCH_TOKEN: ${{ secrets.CBA_DISPATCH_TOKEN }}
    steps:
      # Skipped automatically when the org secret is not configured.
      - name: Notify BoardManagerFiles
        if: env.DISPATCH_TOKEN != ''
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ClangBuiltArduino/BoardManagerFiles/dispatches \
            -d '{"event_type":"tc-build-release","client_payload":{"channel":"${{ env.NIGHTLY == '1' && 'nightly' || 'stable' }}"}}'
