name: AVR bfd Build Pipeline

on:
  workflow_dispatch:

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build bfd linker for avr
        uses: docker/build-push-action@v7
        with:
          context: .
          target: packing
          file: dockerfiles/bfd/avr-linux-amd64.Dockerfile
          push: false
          tags: ghcr.io/clangbuiltarduino/avr-bfd-amd64-linux:${{ github.sha }}
          secrets: |
            "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}"

  dispatch:
    needs: main
    runs-on: ubuntu-latest
    env:
      DISPATCH_TOKEN: ${{ secrets.CBA_DISPATCH_TOKEN }}
    steps:
      # BFD is stable-channel only; nightly pins the latest stable BFD.
      - name: Notify BoardManagerFiles
        if: env.DISPATCH_TOKEN != ''
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ClangBuiltArduino/BoardManagerFiles/dispatches \
            -d '{"event_type":"tc-build-release","client_payload":{"channel":"stable"}}'
